<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src https: data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'" />
  <title>KamanTube</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ambient background -->
  <div class="bg-mesh" aria-hidden="true"><div class="mesh m1"></div><div class="mesh m2"></div><div class="mesh m3"></div></div>

  <div class="app">
    <!-- ============ Sidebar ============ -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4c6 0 12 2 14 8-2 2-6 2-8 1"/> <!-- bow curve -->
            <path d="M4 4l14 8"/>                        <!-- string -->
            <path d="M18.5 3.5 21 1l1 3-2 2z" fill="currentColor" stroke="none"/> <!-- arrow -->
          </svg>
        </div>
        <div>
          <div class="brand-name">KamanTube</div>
          <div class="brand-sub" data-i18n="appName"></div>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-btn active" data-view="home" data-i18n="home"></button>
        <button class="nav-btn" data-view="queue">
          <span data-i18n="queue"></span><span class="badge" id="queue-badge" hidden>0</span>
        </button>
        <button class="nav-btn" data-view="history" data-i18n="history"></button>
        <button class="nav-btn" data-view="settings" data-i18n="settings"></button>
      </nav>

      <div class="sidebar-foot">
        <div class="lang-row">
          <span data-i18n="language"></span>
          <div class="seg">
            <button class="seg-b active" data-lang="fa" data-i18n="fa"></button>
            <button class="seg-b" data-lang="en" data-i18n="en"></button>
          </div>
        </div>
        <div class="dir-row">
          <span class="muted" data-i18n="dirLabel"></span>
          <button class="mini-btn" id="btn-dir" data-i18n="change"></button>
        </div>
        <div class="dir-path" id="dir-path"></div>
        <button class="mini-btn wide" id="btn-open-folder" data-i18n="openFolder"></button>
      </div>
    </aside>

    <!-- ============ Main ============ -->
    <main class="main">
      <header class="topbar">
        <div class="searchbox">
          <svg class="search-ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search-input" type="text" spellcheck="false" />
          <button class="go-btn" id="btn-search" data-i18n="search"></button>
        </div>
        <div class="net" id="net-chip" title="">
          <span class="net-dot" id="net-dot"></span>
          <div class="net-txt">
            <div class="net-ip" id="net-ip">…</div>
            <div class="net-state" id="net-state" data-i18n="checking"></div>
          </div>
        </div>
      </header>

      <section class="view" id="view-body">
        <!-- HOME -->
        <div class="view-pane active" id="pane-home">
          <div class="hero card">
            <div class="hero-bow">
              <svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
                <path d="M4 4c6 0 12 2 14 8-2 2-6 2-8 1"/><path d="M4 4l14 8"/><path d="M18.5 3.5 21 1l1 3-2 2z" fill="currentColor" stroke="none"/>
              </svg>
            </div>
            <h1 class="hero-title">KamanTube</h1>
            <p class="hero-sub" data-i18n="searchPlaceholder"></p>
            <div class="hero-note" data-i18n="tunnelNote"></div>
          </div>
          <div id="home-skel" class="grid" hidden></div>
          <div id="grid-results" class="grid"></div>
          <div id="home-empty" class="empty" data-i18n="emptyHistory"></div>
        </div>

        <!-- VIDEO -->
        <div class="view-pane" id="pane-video">
          <button class="back-btn" data-back="home" data-i18n="backHome"></button>
          <div class="video-wrap card" id="video-wrap">
            <div class="video-thumb">
              <img id="v-thumb" alt="" />
              <div class="v-duration" id="v-duration"></div>
              <div class="thumb-shade"></div>
            </div>
            <div class="video-info">
              <h2 id="v-title"></h2>
              <div class="v-meta">
                <span id="v-channel" class="v-channel"></span>
                <span class="dot">•</span>
                <span id="v-views"></span>
                <span class="dot">•</span>
                <span id="v-date"></span>
              </div>
              <div class="quality-head">
                <h3 data-i18n="quality"></h3>
                <span class="muted small" id="q-hint"></span>
              </div>
              <div class="q-grid" id="q-grid"></div>
              <div class="opt-row">
                <div class="opt">
                  <label data-i18n="subtitle"></label>
                  <div id="v-subs-btns"></div>
                </div>
                <div class="grow"></div>
                <button class="btn primary" id="btn-addq" data-i18n="download"></button>
                <button class="btn ghost" id="btn-audio" data-i18n="audio"></button>
              </div>
            </div>
          </div>
        </div>

        <!-- PLAYLIST -->
        <div class="view-pane" id="pane-playlist">
          <button class="back-btn" data-back="home" data-i18n="backHome"></button>
          <div class="pl-head card">
            <img id="pl-thumb" alt="" />
            <div>
              <h2 id="pl-title"></h2>
              <div class="v-meta"><span id="pl-count" class="muted"></span></div>
            </div>
            <div class="grow"></div>
            <button class="btn primary" id="btn-pl-all" data-i18n="downloadAll"></button>
          </div>
          <div class="pl-items" id="pl-items"></div>
        </div>

        <!-- QUEUE -->
        <div class="view-pane" id="pane-queue">
          <div class="row-between">
            <h2 data-i18n="queue"></h2>
            <button class="mini-btn" id="btn-clear-q" data-i18n="clearQueue"></button>
          </div>
          <div id="queue-items" class="queue-list"></div>
          <div class="empty" id="queue-empty" data-i18n="emptyQueue"></div>
        </div>

        <!-- HISTORY -->
        <div class="view-pane" id="pane-history">
          <h2 data-i18n="history"></h2>
          <div id="history-items" class="queue-list history"></div>
          <div class="empty" id="history-empty" data-i18n="emptyHistory"></div>
        </div>

        <!-- SETTINGS -->
        <div class="view-pane" id="pane-settings">
          <h2 data-i18n="settings"></h2>
          <div class="settings-grid">
            <fieldset class="setting-group">
              <legend data-i18n="themeTitle"></legend>
              <div class="seg">
                <button class="seg-b" data-theme="dark" data-i18n="themeDark"></button>
                <button class="seg-b" data-theme="light" data-i18n="themeLight"></button>
                <button class="seg-b" data-theme="auto" data-i18n="themeAuto"></button>
              </div>
            </fieldset>
            <fieldset class="setting-group">
              <legend data-i18n="downloadOptions"></legend>
              <label class="opt chk">
                <input type="checkbox" id="s-embed-subs" />
                <span data-i18n="embedSubs"></span>
              </label>
              <label class="opt chk">
                <input type="checkbox" id="s-embed-thumb" />
                <span data-i18n="embedThumb"></span>
              </label>
              <label class="opt chk">
                <input type="checkbox" id="s-separate-files" />
                <span data-i18n="separateFiles"></span>
              </label>
            </fieldset>
            <fieldset class="setting-group">
              <legend data-i18n="tunnelTitle"></legend>
              <div class="opt">
                <label data-i18n="tunnelMode"></label>
                <select id="s-tunnel-mode">
                  <option value="auto" data-i18n="auto"></option>
                  <option value="forced" data-i18n="forced"></option>
                  <option value="direct" data-i18n="tunnelModeDirect"></option>
                </select>
              </div>
            </fieldset>
            <fieldset class="setting-group">
              <legend data-i18n="advanced"></legend>
              <button class="btn secondary" id="btn-reset-config" data-i18n="resetConfig"></button>
            </fieldset>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="toasts" id="toasts"></div>
  <script src="app.js"></script>
</body>
</html>
