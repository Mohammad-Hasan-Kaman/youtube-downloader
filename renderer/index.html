<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src https: data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'" />
  <title>KamanTube</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- ================= Sidebar ================= -->
    <aside class="sidebar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 4c6 0 12 2 14 8-2 2-6 2-8 1"/><path d="M4 4l14 8"/><path d="M18.5 3.5 21 1l1 3-2 2z" fill="currentColor" stroke="none"/>
        </svg>
        <div class="brand-text">
          <div class="brand-name">KamanTube</div>
          <div class="brand-sub" data-i18n="tagline"></div>
        </div>
      </div>

      <nav class="nav" id="main-nav">
        <div class="nav-group" data-i18n="groupMain"></div>
        <button class="nav-btn" data-page="home"><span class="nav-ico" data-ico="home"></span><span data-i18n="navHome"></span></button>
        <button class="nav-btn" data-page="search"><span class="nav-ico" data-ico="search"></span><span data-i18n="navSearch"></span></button>
        <button class="nav-btn" data-page="platforms"><span class="nav-ico" data-ico="grid"></span><span data-i18n="navPlatforms"></span></button>
        <button class="nav-btn" data-page="new"><span class="nav-ico" data-ico="plus"></span><span data-i18n="navNew"></span></button>
        <button class="nav-btn" data-page="playlists"><span class="nav-ico" data-ico="playlist"></span><span data-i18n="navPlaylists"></span></button>
        <div class="nav-group" data-i18n="groupLibrary"></div>
        <button class="nav-btn" data-page="queue"><span class="nav-ico" data-ico="queue"></span><span data-i18n="navQueue"></span><span class="badge" id="queue-badge" hidden>0</span></button>
        <button class="nav-btn" data-page="history"><span class="nav-ico" data-ico="history"></span><span data-i18n="navHistory"></span></button>
        <button class="nav-btn" data-page="library"><span class="nav-ico" data-ico="library"></span><span data-i18n="navLibrary"></span></button>
        <div class="nav-group" data-i18n="groupSystem"></div>
        <button class="nav-btn" data-page="settings"><span class="nav-ico" data-ico="settings"></span><span data-i18n="navSettings"></span></button>
        <button class="nav-btn" data-page="diagnostics"><span class="nav-ico" data-ico="activity"></span><span data-i18n="navDiagnostics"></span></button>
        <button class="nav-btn" data-page="about"><span class="nav-ico" data-ico="info"></span><span data-i18n="navAbout"></span></button>
      </nav>

      <div class="sidebar-foot">
        <div class="dir-label"><span data-i18n="downloadDir"></span></div>
        <div class="dir-path" id="dir-path">…</div>
        <button class="btn btn-small btn-block" id="btn-open-folder"><span class="btn-ico" data-ico="folder"></span><span data-i18n="openFolder"></span></button>
      </div>
    </aside>

    <!-- ================= Main ================= -->
    <main class="main">
      <header class="topbar">
        <h1 class="page-title" id="page-title"></h1>
        <div class="topbar-end">
          <div class="net-chip" id="net-chip">
            <span class="net-dot" id="net-dot"></span>
            <div class="net-text">
              <div class="net-ip" id="net-ip">…</div>
              <div class="net-state" id="net-state"></div>
            </div>
          </div>
          <div class="seg" id="theme-seg" role="group" aria-label="theme">
            <button class="seg-btn" data-theme-pick="dark" data-i18n-title="themeDark">◐</button>
            <button class="seg-btn" data-theme-pick="light" data-i18n-title="themeLight">○</button>
            <button class="seg-btn" data-theme-pick="system" data-i18n-title="themeSystem">◑</button>
          </div>
          <div class="seg" id="lang-seg" role="group" aria-label="language">
            <button class="seg-btn" data-lang-pick="fa">فا</button>
            <button class="seg-btn" data-lang-pick="en">EN</button>
            <button class="seg-btn" data-lang-pick="de">DE</button>
            <button class="seg-btn" data-lang-pick="ar">ع</button>
            <button class="seg-btn" data-lang-pick="es">ES</button>
            <button class="seg-btn" data-lang-pick="ru">RU</button>
            <button class="seg-btn" data-lang-pick="zh">中文</button>
          </div>
        </div>
      </header>

      <div class="pages" id="pages">

        <!-- ======== HOME ======== -->
        <section class="page" data-page-panel="home">
          <h2 class="page-h" data-i18n="homeTitle"></h2>
          <p class="page-sub" data-i18n="homeSub"></p>
          <div class="paste-box">
            <input type="text" id="home-url" class="url-input" spellcheck="false" />
            <span class="platform-tag" id="home-platform" hidden></span>
            <button class="btn btn-primary" id="home-fetch" data-i18n="fetchBtn"></button>
          </div>
          <h3 class="section-h" data-i18n="supportedPlatforms"></h3>
          <div class="platform-grid" id="platform-grid"></div>
          <div id="home-recent-wrap" hidden>
            <h3 class="section-h" data-i18n="navHistory"></h3>
            <div class="list" id="home-recent"></div>
          </div>
        </section>

        <!-- ======== SEARCH ======== -->
        <section class="page" data-page-panel="search">
          <div class="search-row">
            <input type="text" id="search-input" class="url-input" spellcheck="false" />
            <button class="btn btn-primary" id="search-btn" data-i18n="searchBtn"></button>
          </div>
          <p class="page-sub" id="search-status" data-i18n="searchHint"></p>
          <div class="cards" id="search-results"></div>
          <div id="explore-wrap">
            <h3 class="section-h" data-i18n="exploreTitle"></h3>
            <p class="page-sub" data-i18n="exploreSub"></p>
            <div class="platform-grid" id="explore-grid"></div>
          </div>
        </section>

        <!-- ======== DETAIL ======== -->
        <section class="page" data-page-panel="detail">
          <div class="detail-head">
            <button class="btn" id="detail-back"><span data-i18n="back"></span></button>
          </div>
          <div class="status-line" id="detail-status" hidden></div>
          <div id="detail-preview"></div>
        </section>

        <!-- ======== NEW DOWNLOAD ======== -->
        <section class="page" data-page-panel="new">
          <p class="page-sub" data-i18n="newSub"></p>
          <div class="paste-box">
            <input type="text" id="new-url" class="url-input" spellcheck="false" />
            <span class="platform-tag" id="new-platform" hidden></span>
            <button class="btn btn-primary" id="new-fetch" data-i18n="fetchBtn"></button>
          </div>
          <div class="status-line" id="new-status" hidden></div>
          <div id="new-preview"></div>
        </section>

        <!-- ======== PLATFORMS ======== -->
        <section class="page" data-page-panel="platforms">
          <p class="page-sub" data-i18n="platformsSub"></p>
          <div class="platform-grid" id="platforms-grid"></div>
          <button class="platform-card sites-card" id="sites-open">
            <span class="platform-body"><span class="platform-name" data-i18n="supportedSites"></span>
            <span class="platform-note" id="sites-count" style="display:block"></span></span>
          </button>
        </section>

        <!-- ======== PLATFORM ======== -->
        <section class="page" data-page-panel="platform">
          <div class="detail-head">
            <button class="btn" id="pf-back"><span data-i18n="back"></span></button>
          </div>
          <div id="pf-head"></div>
          <div class="paste-box">
            <input type="text" id="pf-url" class="url-input" spellcheck="false" />
            <span class="platform-tag" id="pf-platform" hidden></span>
            <button class="btn btn-primary" id="pf-fetch" data-i18n="fetchBtn"></button>
          </div>
          <div class="pf-actions">
            <button class="btn" id="pf-search" data-i18n="navSearch" hidden></button>
            <button class="btn" id="pf-playlists" data-i18n="navPlaylists" hidden></button>
          </div>
        </section>

        <!-- ======== SITES ======== -->
        <section class="page" data-page-panel="sites">
          <div class="detail-head">
            <button class="btn" id="sites-back"><span data-i18n="back"></span></button>
          </div>
          <p class="page-sub" data-i18n="sitesSub"></p>
          <div class="search-row">
            <input type="text" id="sites-filter" class="url-input" spellcheck="false" />
          </div>
          <p class="page-sub" id="sites-status"></p>
          <div class="sites-grid" id="sites-grid"></div>
        </section>

        <!-- ======== PLAYLISTS ======== -->
        <section class="page" data-page-panel="playlists">
          <p class="page-sub" data-i18n="playlistsSub"></p>
          <div class="paste-box">
            <input type="text" id="pl-url" class="url-input" spellcheck="false" />
            <button class="btn btn-primary" id="pl-load" data-i18n="loadPlaylist"></button>
          </div>
          <div class="status-line" id="pl-status" hidden></div>
          <div class="kind-line" id="pl-kind" hidden></div>
          <div id="pl-preview"></div>
          <div id="pl-jobs"></div>
        </section>

        <!-- ======== QUEUE ======== -->
        <section class="page" data-page-panel="queue">
          <div class="row-between">
            <div class="overall" id="queue-overall" hidden>
              <span data-i18n="overallProgress"></span>
              <div class="bar bar-wide"><div class="bar-fill" id="queue-overall-fill"></div></div>
              <span class="mono" id="queue-overall-pct">0%</span>
            </div>
            <span class="grow"></span>
            <button class="btn btn-small" id="queue-clear" data-i18n="clearCompleted"></button>
          </div>
          <div class="list" id="queue-list"></div>
          <div class="empty" id="queue-empty" data-i18n="queueEmpty"></div>
        </section>

        <!-- ======== HISTORY ======== -->
        <section class="page" data-page-panel="history">
          <div class="row-between">
            <span class="grow"></span>
            <button class="btn btn-small" id="history-clear" data-i18n="clearHistory"></button>
          </div>
          <div class="list" id="history-list"></div>
          <div class="empty" id="history-empty" data-i18n="historyEmpty"></div>
        </section>

        <!-- ======== LIBRARY ======== -->
        <section class="page" data-page-panel="library">
          <div class="search-row">
            <input type="text" id="lib-search" class="url-input" spellcheck="false" />
            <div class="seg" id="lib-filter">
              <button class="seg-btn active" data-lib-kind="all" data-i18n="allTypes"></button>
              <button class="seg-btn" data-lib-kind="video" data-i18n="typeVideo"></button>
              <button class="seg-btn" data-lib-kind="audio" data-i18n="typeAudio"></button>
              <button class="seg-btn" data-lib-kind="image" data-i18n="typeImage"></button>
            </div>
            <button class="btn" id="lib-refresh" data-i18n="refresh"></button>
          </div>
          <div class="list" id="library-list"></div>
          <div class="empty" id="library-empty" data-i18n="libraryEmpty" hidden></div>
        </section>

        <!-- ======== SETTINGS ======== -->
        <section class="page" data-page-panel="settings">
          <div class="settings-grid">
            <fieldset class="card">
              <legend data-i18n="secGeneral"></legend>
              <label class="field"><span data-i18n="language"></span>
                <select id="s-lang">
                  <option value="fa" data-i18n="langFa"></option>
                  <option value="en" data-i18n="langEn"></option>
                  <option value="de" data-i18n="langDe"></option>
                  <option value="ar" data-i18n="langAr"></option>
                  <option value="es" data-i18n="langEs"></option>
                  <option value="ru" data-i18n="langRu"></option>
                  <option value="zh" data-i18n="langZh"></option>
                </select>
              </label>
              <label class="field"><span data-i18n="theme"></span>
                <select id="s-theme">
                  <option value="dark" data-i18n="themeDark"></option>
                  <option value="light" data-i18n="themeLight"></option>
                  <option value="system" data-i18n="themeSystem"></option>
                </select>
              </label>
              <label class="field"><span data-i18n="downloadDir"></span>
                <span class="dir-inline"><span class="dir-path" id="s-dir-path">…</span>
                <button class="btn btn-small" id="s-dir-pick" data-i18n="change"></button></span>
              </label>
            </fieldset>

            <fieldset class="card">
              <legend data-i18n="secDownloads"></legend>
              <label class="field"><span data-i18n="defaultQuality"></span>
                <select id="s-quality">
                  <option value="best" data-i18n="qualityBest"></option>
                  <option value="2160">2160p</option><option value="1440">1440p</option>
                  <option value="1080">1080p</option><option value="720">720p</option>
                  <option value="480">480p</option><option value="360">360p</option>
                  <option value="240">240p</option><option value="144">144p</option>
                </select>
              </label>
              <label class="field"><span data-i18n="concurrency"></span>
                <input type="number" id="s-concurrency" min="1" max="5" step="1" />
              </label>
              <label class="field"><span data-i18n="speedLimit"></span>
                <input type="number" id="s-ratelimit" min="0" step="50" />
              </label>
            </fieldset>

            <fieldset class="card">
              <legend data-i18n="secSubsThumb"></legend>
              <label class="field"><span data-i18n="subsMode"></span>
                <select id="s-subsmode">
                  <option value="embedded" data-i18n="modeEmbedded"></option>
                  <option value="separate" data-i18n="modeSeparate"></option>
                  <option value="disabled" data-i18n="modeDisabled"></option>
                </select>
              </label>
              <label class="field"><span data-i18n="thumbMode"></span>
                <select id="s-thumbmode">
                  <option value="embedded" data-i18n="modeEmbedded"></option>
                  <option value="separate" data-i18n="modeSeparate"></option>
                  <option value="disabled" data-i18n="modeDisabled"></option>
                </select>
              </label>
              <label class="field"><span data-i18n="defaultSubLang"></span>
                <input type="text" id="s-sublang" spellcheck="false" placeholder="fa" />
              </label>
            </fieldset>

            <fieldset class="card">
              <legend data-i18n="secNetwork"></legend>
              <label class="field"><span data-i18n="tunnelMode"></span>
                <select id="s-tunnelmode">
                  <option value="auto" data-i18n="tunnelAuto"></option>
                  <option value="forced" data-i18n="tunnelForced"></option>
                  <option value="direct" data-i18n="tunnelDirect"></option>
                </select>
              </label>
              <p class="note" data-i18n="tunnelNote"></p>
            </fieldset>

            <fieldset class="card">
              <legend data-i18n="secAccount"></legend>
              <label class="field"><span data-i18n="accountMode"></span>
                <select id="s-account-mode">
                  <option value="off" data-i18n="accountOff"></option>
                  <option value="browser" data-i18n="accountBrowserOpt"></option>
                  <option value="file" data-i18n="accountFileOpt"></option>
                </select>
              </label>
              <label class="field" id="s-account-browser-row" hidden><span data-i18n="accountBrowserOpt"></span>
                <select id="s-account-browser">
                  <option value="chrome">Chrome</option>
                  <option value="edge">Edge</option>
                  <option value="firefox">Firefox</option>
                  <option value="brave">Brave</option>
                </select>
              </label>
              <div class="field" id="s-account-file-row" hidden><span data-i18n="accountFileOpt"></span>
                <span class="dir-inline"><span class="dir-path" id="s-cookies-path"></span>
                <button class="btn btn-small" id="s-cookies-pick" data-i18n="accountFilePick"></button></span>
                <p class="note" data-i18n="accountFileHint"></p>
              </div>
              <p class="note" data-i18n="accountNote"></p>
            </fieldset>

            <fieldset class="card">
              <legend data-i18n="secAdvanced"></legend>
              <div class="kv"><span data-i18n="appVersion"></span><b class="mono" id="v-app">…</b></div>
              <div class="kv"><span data-i18n="ytDlpVersion"></span><b class="mono" id="v-ytdlp">…</b></div>
              <div class="kv"><span data-i18n="ffmpegState"></span><b id="v-ffmpeg">…</b></div>
              <div class="kv"><span data-i18n="aetherState"></span><b id="v-aether">…</b></div>
              <button class="btn btn-danger" id="s-reset" data-i18n="resetConfig"></button>
            </fieldset>
          </div>
        </section>

        <!-- ======== DIAGNOSTICS ======== -->
        <section class="page" data-page-panel="diagnostics">
          <div class="diag-grid">
            <div class="card kv-card">
              <div class="kv"><span data-i18n="publicIp"></span><b class="mono" id="d-ip">…</b></div>
              <div class="kv"><span data-i18n="country"></span><b id="d-country">…</b></div>
              <div class="kv"><span data-i18n="routingMode"></span><b id="d-route">…</b></div>
              <div class="kv"><span data-i18n="protocol"></span><b id="d-protocol">…</b></div>
              <button class="btn btn-primary" id="d-recheck" data-i18n="recheck"></button>
            </div>
            <div class="card log-card">
              <div class="card-h" data-i18n="connectionLog"></div>
              <pre class="log" id="d-log"></pre>
            </div>
          </div>
        </section>

        <!-- ======== ABOUT ======== -->
        <section class="page" data-page-panel="about">
          <div class="about-box">
            <svg class="brand-mark big" viewBox="0 0 24 24" width="54" height="54" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 4c6 0 12 2 14 8-2 2-6 2-8 1"/><path d="M4 4l14 8"/><path d="M18.5 3.5 21 1l1 3-2 2z" fill="currentColor" stroke="none"/>
            </svg>
            <h2 class="about-name">KamanTube</h2>
            <div class="about-slogan" data-i18n="slogan"></div>
            <div class="about-ver mono" id="a-version"></div>
            <p class="about-text" data-i18n="aboutText"></p>
            <p class="note" data-i18n="licenseLine"></p>
            <a class="repo-link" href="https://github.com/Mohammad-Hasan-Kaman/youtube-downloader" data-i18n="repoLine"></a>
          </div>
        </section>

      </div>
    </main>
  </div>

  <div class="toasts" id="toasts"></div>
  <script src="../src/providers.js"></script>
  <script src="../src/queue.js"></script>
  <script src="app.js"></script>
</body>
</html>
